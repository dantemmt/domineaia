<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>ASMR Cuts</title>
<script type="importmap">
{ "imports": {
    "three": "/node_modules/three/build/three.module.js",
    "three/addons/": "/node_modules/three/examples/jsm/"
} }
</script>
<link rel="stylesheet" href="/node_modules/@fontsource/noto-color-emoji/index.css">
<style>
  @font-face { font-family: 'Mont'; font-weight: 900; src: url('/node_modules/@fontsource/montserrat/files/montserrat-latin-900-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Mont'; font-weight: 800; src: url('/node_modules/@fontsource/montserrat/files/montserrat-latin-800-normal.woff2') format('woff2'); }
  html, body { margin: 0; padding: 0; width: 1080px; height: 1920px; overflow: hidden;
    background: radial-gradient(ellipse 110% 65% at 50% 34%, #3d4149 0%, #25272d 45%, #111215 100%); }
  #c { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  #vig { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 85% 70% at 50% 45%, rgba(0,0,0,0) 55%, rgba(0,0,0,.45) 100%); }
  #ov { position: absolute; inset: 0; pointer-events: none; }

  /* títulos: preenchimento + contorno grosso (camada ::before atrás) */
  .t { position: absolute; left: 50%; white-space: nowrap; isolation: isolate;
    font-family: 'Mont', 'Noto Color Emoji', sans-serif; font-weight: 900; font-size: 112px; line-height: 1;
    letter-spacing: -2px; color: #ffffff; transform-origin: 50% 60%; }
  .t::before { content: attr(data-text); position: absolute; left: 0; top: 0; z-index: -1;
    color: #0c0c0f; -webkit-text-stroke: 18px #0c0c0f;
    filter: drop-shadow(0 10px 0 rgba(0,0,0,.35)) drop-shadow(0 0 30px rgba(0,0,0,.5)); }
  .hi { color: var(--hi, #ffd43b); }
  #vs { font-size: 84px; color: #ff5a5f; }

  #cnt { position: absolute; left: 50%; top: 340px; transform: translateX(-50%); padding: 14px 34px 20px;
    border-radius: 999px; background: rgba(10,10,14,.62); border: 3px solid rgba(255,255,255,.18);
    box-shadow: 0 10px 30px rgba(0,0,0,.45); text-align: center; min-width: 300px; }
  #cntTxt { font-family: 'Mont', sans-serif; font-weight: 800; font-size: 54px; color: #fff;
    font-variant-numeric: tabular-nums; letter-spacing: 0px; white-space: nowrap; }
  #barBg { margin: 10px auto 0; height: 10px; width: 100%; border-radius: 6px; background: rgba(255,255,255,.18); overflow: hidden; }
  #bar { height: 100%; width: 0%; border-radius: 6px; background: linear-gradient(90deg, #ffd43b, #ff8a3d); }
  #cnt.done #bar { background: linear-gradient(90deg, #5be38a, #2fc56a); }
  #cnt.done #cntTxt { color: #8dffb3; }

  #outro { font-size: 80px; white-space: normal; width: 940px; text-align: center; line-height: 1.08; letter-spacing: -1px; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="vig"></div>
<div id="ov">
  <div id="h1" class="t" style="top:190px"></div>
  <div id="vs" class="t" style="top:318px"></div>
  <div id="h3" class="t hi" style="top:418px"></div>
  <div id="cnt" style="opacity:0"><div id="cntTxt"></div><div id="barBg"><div id="bar"></div></div></div>
  <div id="outro" class="t" style="top:640px"></div>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
