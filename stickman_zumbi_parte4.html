<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stickman Zumbi — Episódio 4</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  #stage{position:relative;width:1280px;height:720px;flex:none;transform-origin:center center;overflow:hidden;background:#000}
  #c{display:block;width:1280px;height:720px}
  #sub{position:absolute;left:0;right:0;bottom:66px;text-align:center;pointer-events:none}
  #sub span{display:inline-block;max-width:1040px;background:rgba(12,12,14,.66);color:#fff;font-size:27px;font-weight:500;
    line-height:1.36;padding:5px 15px 6px;border-radius:5px;letter-spacing:.005em;opacity:0;transition:opacity .18s linear}
  #sub span.on{opacity:1}
  #cta{position:absolute;left:0;right:0;bottom:16px;text-align:center;pointer-events:none;opacity:0}
  #cta .in{position:relative;display:inline-block;padding-top:7px;font-size:15px;font-weight:400;letter-spacing:.085em;
    color:rgba(255,255,255,.75);text-shadow:0 1px 7px rgba(0,0,0,.7),0 0 2px rgba(0,0,0,.45)}
  #cta .ln{position:absolute;left:0;top:0;width:100%;height:1px;background:rgba(255,255,255,.6);
    transform-origin:left center;transform:scaleX(0);box-shadow:0 0 4px rgba(0,0,0,.4)}
  #title{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;
    font-family:Georgia,"Times New Roman",Times,serif;color:#fff;font-size:68px;letter-spacing:.16em;font-weight:400}
  #start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:radial-gradient(ellipse at center,#1b1d22 0%,#060607 75%);color:#eee;z-index:5}
  #start h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:44px;letter-spacing:.08em}
  #start p{margin:0;color:#9a9ca3;font-size:16px;letter-spacing:.12em;text-transform:uppercase}
  #play{margin-top:14px;font:600 20px Inter,-apple-system,"Segoe UI",Arial,sans-serif;color:#111;background:#f2f2f2;border:0;
    padding:14px 46px;border-radius:40px;cursor:pointer;letter-spacing:.04em;box-shadow:0 6px 30px rgba(0,0,0,.6)}
  #play:hover{background:#fff}
  #vrow{display:flex;gap:10px;align-items:center;color:#8d9097;font-size:13px;letter-spacing:.04em}
  #voice{background:#15161a;color:#ddd;border:1px solid #33353b;border-radius:6px;padding:6px 8px;font-size:13px;max-width:330px}
  .hide{display:none!important}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="c" width="1280" height="720"></canvas>
  <div id="sub"><span></span></div>
  <div id="cta"><div class="in"><div class="ln"></div>quer aprender a fazer vídeos como esse? link na bio</div></div>
  <div id="title">CONTINUA...</div>
  <div id="start">
    <p>Stickman Zumbi</p>
    <h1>Episódio 4</h1>
    <button id="play">Assistir</button>
    <div id="vrow" class="hide"><label for="voice">Voz da narração</label><select id="voice"></select></div>
  </div>
</div></div>

<script>
'use strict';
/* =========================================================================
   STICKMAN ZUMBI — EPISÓDIO 2
   Tudo sintetizado: imagem (canvas 2D + mini motor 3D), som (Web Audio),
   narração (speechSynthesis pt-BR).
   ========================================================================= */
const W = 1280, H = 720, DUR = 92;
const $ = id => document.getElementById(id);
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

const cv = $('c'), g = cv.getContext('2d');
const buf = mk(W, H), b = buf.getContext('2d');
const tmpA = mk(W, H), ta = tmpA.getContext('2d'), SMALL = mk(160, 90);

/* ---------------- utilidades ---------------- */
const clamp = (x, a = 0, c = 1) => x < a ? a : x > c ? c : x;
const lerp = (a, c, t) => a + (c - a) * t;
const ss = (a, c, x) => { const t = clamp((x - a) / (c - a)); return t * t * (3 - 2 * t); };
const eio = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const sm = (a, c, x) => eio(clamp((x - a) / (c - a)));
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const CC = {};
function hex(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function C(h) { return Array.isArray(h) ? h : (CC[h] || (CC[h] = hex(h))); }
const mix = (c1, c2, t) => [lerp(c1[0], c2[0], t), lerp(c1[1], c2[1], t), lerp(c1[2], c2[2], t)];
const shade = (c, k) => [c[0] * k, c[1] * k, c[2] * k];
const css = (c, a) => a === undefined ? `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})` : `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
// ruído suave determinístico (para tremores de câmera)
function nz(t, s) { return Math.sin(t * 1.7 + s) * .5 + Math.sin(t * 3.1 + s * 2.3) * .3 + Math.sin(t * 7.3 + s * 4.1) * .2; }

/* =========================================================================
   MINI MOTOR 3D (projeção perspectiva + painter's algorithm + névoa)
   ========================================================================= */
const cam = { x: 0, y: 1.6, z: 0, yaw: 0, pitch: 0, roll: 0, fov: 1.2 };
let FOG = { c: [180, 180, 180], d: .03, m: .85 };
let LIGHT = { top: 1.05, bot: .55, l: .78, r: .9, f: .94, bk: .8 };
let VW = W, VH = H;
const NEAR = .04;
function focal() { return (VW / 2) / Math.tan(cam.fov / 2); }
function toCam(p) {
  const dx = p[0] - cam.x, dy = p[1] - cam.y, dz = p[2] - cam.z;
  const cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw);
  const x1 = dx * cy - dz * sy, z1 = dx * sy + dz * cy;

  return [x1, dy * cp - z1 * sp, dy * sp + z1 * cp];
}
function proj(c) {

  if (cam.roll) { const cr = Math.cos(cam.roll), sr = Math.sin(cam.roll); const nx = x * cr - y * sr; y = x * sr + y * cr; x = nx; }
  return [VW / 2 + x, VH / 2 + y];
}
function P3(p) { const q = toCam(p); return q[2] > NEAR ? proj(q) : null; }
function clipNear(poly) {
  const out = [];
  for (let i = 0; i < poly.length; i++) {
    const a = poly[i], c = poly[(i + 1) % poly.length];
    const ai = a[2] >= NEAR, ci = c[2] >= NEAR;
    if (ai) out.push(a);
    if (ai !== ci) { const t = (NEAR - a[2]) / (c[2] - a[2]); out.push([a[0] + (c[0] - a[0]) * t, a[1] + (c[1] - a[1]) * t, NEAR]); }
  }
  return out;
}
function fogK(f, d) { return f.m * (1 - Math.exp(-d * f.d)); }
function softPoly(ctx, sp, fill, a, r) {
  let cx = 0, cy = 0; for (const p of sp) { cx += p[0]; cy += p[1]; } cx /= sp.length; cy /= sp.length;
  ctx.fillStyle = fill;
  for (let k = 0; k < 4; k++) { const e = r * (k - 1.5) * .9; ctx.globalAlpha = a * .25;
    ctx.beginPath(); sp.forEach((p, i) => { const dx = p[0] - cx, dy = p[1] - cy, l = Math.hypot(dx, dy) || 1, x = p[0] + dx / l * e, y = p[1] + dy / l * e; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.closePath(); ctx.fill(); }
}
function shaft(ctx, pts, col, a, r) { if (pts.some(p => !p)) return; ctx.save(); ctx.globalCompositeOperation = 'lighter'; softPoly(ctx, pts, col, a, r); ctx.restore(); }
function pathPts(ctx, sp) { ctx.beginPath(); ctx.moveTo(sp[0][0], sp[0][1]); for (let i = 1; i < sp.length; i++) ctx.lineTo(sp[i][0], sp[i][1]); ctx.closePath(); }

// mapeamento afim de textura em triângulo
function texTri(ctx, img, s0, s1, s2, d0, d1, d2) {
  const cx = (d0[0] + d1[0] + d2[0]) / 3, cy = (d0[1] + d1[1] + d2[1]) / 3;
  const inf = p => { const dx = p[0] - cx, dy = p[1] - cy, l = Math.hypot(dx, dy) || 1; return [p[0] + dx / l * .7, p[1] + dy / l * .7]; };
  ctx.save(); ctx.beginPath(); const a0 = inf(d0), a1 = inf(d1), a2 = inf(d2);
  ctx.moveTo(a0[0], a0[1]); ctx.lineTo(a1[0], a1[1]); ctx.lineTo(a2[0], a2[1]); ctx.closePath(); ctx.clip();
  const D = (s1[0] - s0[0]) * (s2[1] - s0[1]) - (s2[0] - s0[0]) * (s1[1] - s0[1]);
  const a = ((d1[0] - d0[0]) * (s2[1] - s0[1]) - (d2[0] - d0[0]) * (s1[1] - s0[1])) / D;
  const bb = ((d1[1] - d0[1]) * (s2[1] - s0[1]) - (d2[1] - d0[1]) * (s1[1] - s0[1])) / D;
  const c = ((s1[0] - s0[0]) * (d2[0] - d0[0]) - (s2[0] - s0[0]) * (d1[0] - d0[0])) / D;
  const d = ((s1[0] - s0[0]) * (d2[1] - d0[1]) - (s2[0] - s0[0]) * (d1[1] - d0[1])) / D;
  const e = d0[0] - a * s0[0] - c * s0[1], f = d0[1] - bb * s0[0] - d * s0[1];
  ctx.transform(a, bb, c, d, e, f); ctx.drawImage(img, 0, 0); ctx.restore();
}

// construtores de itens
const Pp = (pts, col, o) => ({ k: 'p', pts, col, o: o || {} });
const Bx = (x0, y0, z0, x1, y1, z1, col, o) => ({ k: 'b', a: [Math.min(x0, x1), Math.min(y0, y1), Math.min(z0, z1)], b: [Math.max(x0, x1), Math.max(y0, y1), Math.max(z0, z1)], col, o: o || {} });
const St = (p, h, o) => ({ k: 's', p, h, o: o || {} });
const Gl = (p, r, col, a, o) => ({ k: 'g', p, r, col, a, o: o || {} });
const Ln = (p, q, col, w, o) => ({ k: 'l', p, q, col, w, o: o || {} });
const Fn = (p, fn, o) => ({ k: 'f', p, fn, o: o || {} });
// polígonos utilitários
const quadX = (x, y0, y1, z0, z1, col, o) => Pp([[x, y1, z0], [x, y1, z1], [x, y0, z1], [x, y0, z0]], col, o);
const quadZ = (z, x0, x1, y0, y1, col, o) => Pp([[x0, y1, z], [x1, y1, z], [x1, y0, z], [x0, y0, z]], col, o);
const quadY = (y, x0, x1, z0, z1, col, o) => Pp([[x0, y, z1], [x1, y, z1], [x1, y, z0], [x0, y, z0]], col, o);
const zs = (z0, z1, n) => { const r = []; for (let i = 0; i <= n; i++) r.push(z0 + (z1 - z0) * Math.pow(i / n, 1.8)); return r; };
function segY(arr, y, x0, x1, z0, z1, col, o, n = 12) { const z = zs(z0, z1, n); for (let i = 0; i < n; i++) arr.push(quadY(y, x0, x1, z[i], z[i + 1], col, o)); }
function segX(arr, x, y0, y1, z0, z1, col, o, n = 8) { const z = zs(z0, z1, n); for (let i = 0; i < n; i++) arr.push(quadX(x, y0, y1, z[i], z[i + 1], col, o)); }

function drawPoly(ctx, pts, col, o) {
  const cs = pts.map(toCam); const cl = clipNear(cs); if (cl.length < 3) return;
  const sp = cl.map(proj);
  let mx = 0, my = 0, mz = 0; for (const q of cs) { mx += q[0]; my += q[1]; mz += q[2]; }
  const n = cs.length, dist = Math.hypot(mx / n, my / n, mz / n);
  const f = o.fog || FOG; const fk = o.nofog ? 0 : fogK(f, dist);
  const c = o.sh ? shade(col, o.sh) : col;
  ctx.save();
  if (o.blend) ctx.globalCompositeOperation = o.blend;
  if (o.a !== undefined) ctx.globalAlpha = o.a;
  if (o.tex) {
    if (cl.length === 4 && cs.every(q => q[2] > NEAR)) {
      const tw = o.tex.width, th = o.tex.height, p = sp;
      texTri(ctx, o.tex, [0, 0], [tw, 0], [0, th], p[0], p[1], p[3]);
      texTri(ctx, o.tex, [tw, th], [0, th], [tw, 0], p[2], p[3], p[1]);
      if (fk > .01) { pathPts(ctx, sp); ctx.fillStyle = css(f.c, fk); ctx.fill(); }
      if (o.dim) { pathPts(ctx, sp); ctx.fillStyle = `rgba(0,0,0,${o.dim})`; ctx.fill(); }
    }
  } else {
    if (o.blur) { softPoly(ctx, sp, css(mix(c, f.c, fk)), o.a ?? 1, o.blur); ctx.restore(); return; }
    pathPts(ctx, sp);
    if (o.grad) {
      const gg = o.grad(ctx, sp); ctx.fillStyle = gg;
    } else ctx.fillStyle = css(mix(c, f.c, fk));
    ctx.fill();
    if (o.stroke) { ctx.filter = 'none'; ctx.strokeStyle = o.stroke; ctx.lineWidth = o.sw || 1; ctx.stroke(); }
  }
  ctx.restore();
}
function drawBox(ctx, it) {
  const a = it.a, c = it.b, col = C(it.col), o = it.o, L = o.light || LIGHT;
  const F = [];
  if (cam.y > c[1] && !o.notop) F.push([[a[0], c[1], a[2]], [c[0], c[1], a[2]], [c[0], c[1], c[2]], [a[0], c[1], c[2]], L.top]);
  if (cam.y < a[1]) F.push([[a[0], a[1], a[2]], [c[0], a[1], a[2]], [c[0], a[1], c[2]], [a[0], a[1], c[2]], L.bot]);
  if (cam.x < a[0]) F.push([[a[0], a[1], a[2]], [a[0], c[1], a[2]], [a[0], c[1], c[2]], [a[0], a[1], c[2]], L.l]);
  if (cam.x > c[0]) F.push([[c[0], a[1], a[2]], [c[0], c[1], a[2]], [c[0], c[1], c[2]], [c[0], a[1], c[2]], L.r]);
  if (cam.z < a[2]) F.push([[a[0], a[1], a[2]], [c[0], a[1], a[2]], [c[0], c[1], a[2]], [a[0], c[1], a[2]], L.f]);
  if (cam.z > c[2]) F.push([[a[0], a[1], c[2]], [c[0], a[1], c[2]], [c[0], c[1], c[2]], [a[0], c[1], c[2]], L.bk]);
  for (const fc of F) drawPoly(ctx, fc.slice(0, 4), shade(col, fc[4] * (o.sh || 1)), { fog: o.fog, nofog: o.nofog, a: o.a, stroke: o.stroke, sw: o.sw });
}
function drawGlow(ctx, it) {
  const q = toCam(it.p); if (q[2] < NEAR) return; const s = proj(q);
  const r = it.r * focal() / q[2]; if (r < .5) return;
  const col = C(it.col), gr = ctx.createRadialGradient(s[0], s[1], 0, s[0], s[1], r);
  gr.addColorStop(0, css(col, it.a)); gr.addColorStop(.35, css(col, it.a * .45)); gr.addColorStop(1, css(col, 0));
  ctx.save(); ctx.globalCompositeOperation = it.o.blend || 'lighter'; ctx.fillStyle = gr;
  if (it.o.sy) { ctx.translate(s[0], s[1]); ctx.scale(1, it.o.sy); ctx.translate(-s[0], -s[1]); }
  ctx.fillRect(s[0] - r, s[1] - r, 2 * r, 2 * r); ctx.restore();
}
function drawLine3(ctx, it) {
  let a = toCam(it.p), c = toCam(it.q);
  if (a[2] < NEAR && c[2] < NEAR) return;
  if (a[2] < NEAR) { const t = (NEAR - a[2]) / (c[2] - a[2]); a = [a[0] + (c[0] - a[0]) * t, a[1] + (c[1] - a[1]) * t, NEAR]; }
  if (c[2] < NEAR) { const t = (NEAR - c[2]) / (a[2] - c[2]); c = [c[0] + (a[0] - c[0]) * t, c[1] + (a[1] - c[1]) * t, NEAR]; }
  const p1 = proj(a), p2 = proj(c), d = Math.hypot((a[0] + c[0]) / 2, (a[1] + c[1]) / 2, (a[2] + c[2]) / 2);
  const f = it.o.fog || FOG;
  ctx.save(); ctx.strokeStyle = css(mix(C(it.col), f.c, it.o.nofog ? 0 : fogK(f, d)), it.o.a ?? 1);
  ctx.lineWidth = it.o.wm ? Math.max(.6, it.o.wm * focal() / Math.max(.1, (a[2] + c[2]) / 2)) : it.w; ctx.lineCap = 'round';

}
function drawStickIt(ctx, it) {
  const q = toCam(it.p); if (q[2] < .15) return; const s = proj(q);
  const S = it.h * focal() / q[2]; const f = it.o.fog || FOG; const fk = fogK(f, Math.hypot(q[0], q[1], q[2]));
  ctx.save(); ctx.translate(s[0], s[1]); if (cam.roll) ctx.rotate(cam.roll);
  drawStick(ctx, 0, 0, S, Object.assign({}, it.o, { fk, fc: f.c })); ctx.restore();
  it._screen = { x: s[0], y: s[1], S };
}
function drawIt(ctx, it) {
  switch (it.k) {
    case 'p': return drawPoly(ctx, it.pts, C(it.col), it.o);
    case 'b': return drawBox(ctx, it);
    case 's': return drawStickIt(ctx, it);
    case 'g': return drawGlow(ctx, it);
    case 'l': return drawLine3(ctx, it);
    case 'f': return it.fn(ctx, it);
  }
}
function centerOf(it) {
  if (it.k === 'b') return [(it.a[0] + it.b[0]) / 2, (it.a[1] + it.b[1]) / 2, (it.a[2] + it.b[2]) / 2];
  if (it.k === 'p') { let x = 0, y = 0, z = 0; for (const p of it.pts) { x += p[0]; y += p[1]; z += p[2]; } const n = it.pts.length; return [x / n, y / n, z / n]; }
  if (it.k === 'l') return [(it.p[0] + it.q[0]) / 2, (it.p[1] + it.q[1]) / 2, (it.p[2] + it.q[2]) / 2];
  return it.p;
}
function render3D(ctx, base, list) {
  for (const it of base) drawIt(ctx, it);
  for (const it of list) { const q = toCam(it.o.dp || centerOf(it)); it._d = Math.hypot(q[0], q[1], q[2]) + (it.o.bias || 0); }
  list.sort((p, q) => q._d - p._d);
  for (const it of list) drawIt(ctx, it);

/* =========================================================================
   PERSONAGEM PALITO
   ========================================================================= */
function stickJ(o) {
  const r = .155, br = (o.breath || 0) * .009;
  const top = -.70 + br, hip = [0, -.43], neck = [0, top], sh = [0, top + .045];
  const head = [(o.hx || 0) * r, top - r * .97 + (o.hy || 0) * r];
  const arm = (side, A) => {
    const a1 = A[0], a2 = A[1], l1 = A[2] ?? .17, l2 = A[3] ?? .165;
    const e = [side * Math.sin(a1) * l1, sh[1] + Math.cos(a1) * l1];
    return [sh, e, [e[0] + side * Math.sin(a2) * l2, e[1] + Math.cos(a2) * l2]];
  };
  const w = o.walk || 0;
  return {
    r, neck, hip, sh, head,
    aL: arm(-1, o.armL || [.17, .1]), aR: arm(1, o.armR || [.17, .1]),
    fL: [-.065 + Math.sin(w) * .06, 0], fR: [.065 - Math.sin(w) * .06, -Math.max(0, Math.cos(w)) * .0]
  };
}
function drawStick(ctx, x, y, S, o) {
  const J = stickJ(o), fk = o.fk || 0, fc = o.fc || [128, 128, 128];
  const base = o.col ? C(o.col) : [11, 11, 13];
  const col = css(mix(base, fc, fk));
  ctx.save(); ctx.translate(x, y); if (o.sway) ctx.rotate(o.sway); ctx.scale(S, S);
  const lw = Math.max(1.25 / S, .0235);
  ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = col; ctx.fillStyle = col;
  if (o.alpha !== undefined) ctx.globalAlpha = o.alpha;
  const seg = (a, c) => { ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(c[0], c[1]); ctx.stroke(); };
  const arm = a => { ctx.beginPath(); ctx.moveTo(a[0][0], a[0][1]); ctx.lineTo(a[1][0], a[1][1]); ctx.lineTo(a[2][0], a[2][1]); ctx.stroke(); };
  seg(J.hip, J.fL); seg(J.hip, J.fR); seg(J.hip, J.neck);
  arm(J.aL); arm(J.aR);
  if (o.bandage) drawBandage(ctx, o.bandage.side < 0 ? J.aL : J.aR, lw, o.bandage);

  VW = W; VH = H;

  frameN++;

  if (POST.mblur > 0) g.globalAlpha = 1 - POST.mblur; else { g.globalAlpha = 1; g.fillStyle = '#000'; g.fillRect(0, 0, W, H); }
  const z = 1.045; g.translate(W / 2 + POST.shx, H / 2 + POST.shy); g.rotate(POST.rot); g.scale(z, z); g.drawImage(buf, -W / 2, -H / 2); g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalAlpha = POST.grain; g.globalCompositeOperation = 'overlay';
  g.drawImage(TX.noise[frameN % 4], -Math.random() * 16, -Math.random() * 16, W + 16, H + 16);
  g.globalCompositeOperation = 'source-over';
  if (POST.vig > 0) { g.globalAlpha = Math.min(1, POST.vig); g.drawImage(TX.vig, 0, 0); }
  if (POST.vig2 > 0) { g.globalAlpha = POST.vig2; g.drawImage(TX.vig, -W * .15, -H * .15, W * 1.3, H * 1.3); g.drawImage(TX.vig, 0, 0); }
  g.globalAlpha = .025 + Math.random() * .03; g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
  if (POST.black > 0) { g.globalAlpha = Math.min(1, POST.black); g.fillRect(0, 0, W, H); }
  g.globalAlpha = 1;
  overlays(t);
}
